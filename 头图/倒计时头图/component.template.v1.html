<table class="freshine-component freshine-countdown-overlay-hero" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.heroFallback}}" style="width:100%;max-width:{{settings.content.maxWidth}};border-collapse:collapse;margin:0 auto;background-color:{{settings.color.heroFallback}};">
  <!-- FRESHINE_IF_SETTING:navigation.visible -->
  <tr>
    <td class="freshine-countdown-navigation-left" width="75.5%" height="71" align="center" valign="middle" bgcolor="{{settings.color.navigationLeft}}" style="width:75.5%;height:71px;height:min(71px,11.833333vw);padding:0 18px;padding:0 min(18px,3vw);background-color:{{settings.color.navigationLeft}};color:{{settings.color.navigationText}};text-align:center;vertical-align:middle;">
      <!-- FRESHINE_SLOT_START:navigation.text --><span class="freshine-countdown-navigation-copy" data-freshine-slot="navigation.text" style="display:inline-block;color:{{settings.color.navigationText}};font-family:{{settings.font.body}};font-size:18px;font-size:min(18px,3vw);font-weight:400;line-height:24px;line-height:min(24px,4vw);text-align:center;">{{content.navigation.text}}</span><!-- FRESHINE_SLOT_END:navigation.text -->
    </td>
    <td class="freshine-countdown-navigation-right" width="24.5%" height="71" align="center" valign="middle" bgcolor="{{settings.color.navigationRight}}" style="width:24.5%;height:71px;height:min(71px,11.833333vw);padding:0 10px;padding:0 min(10px,1.666667vw);background-color:{{settings.color.navigationRight}};text-align:center;vertical-align:middle;">
      <a class="freshine-countdown-navigation-link" href="{{content.navigation.url}}" data-freshine-href-slot="navigation.url" target="_blank" style="display:inline-block;color:{{settings.color.navigationText}};font-family:{{settings.font.action}};font-size:18px;font-size:min(18px,3vw);font-weight:400;line-height:24px;line-height:min(24px,4vw);text-align:center;text-decoration:underline;"><!-- FRESHINE_SLOT_START:navigation.linkText --><span data-freshine-slot="navigation.linkText">{{content.navigation.linkText}}</span><!-- FRESHINE_SLOT_END:navigation.linkText --></a>
    </td>
  </tr>
  <!-- FRESHINE_END_IF_SETTING:navigation.visible -->
  <tr>
    <td class="freshine-countdown-hero-shell" colspan="2" align="center" valign="top" bgcolor="{{settings.color.heroFallback}}" style="padding:0;background-color:{{settings.color.heroFallback}};text-align:center;vertical-align:top;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
        <tr>
          <td class="freshine-countdown-hero-background" role="img" aria-label="{{content.hero.backgroundImage.alt}}" background="{{content.hero.backgroundImage.url}}" height="722" align="center" valign="top" bgcolor="{{settings.color.heroFallback}}" style="display:block;height:120vw;max-height:722px;min-height:368px;background-color:{{settings.color.heroFallback}};background-image:url('{{content.hero.backgroundImage.url}}');background-position:{{settings.background.position}};background-repeat:no-repeat;background-size:cover;text-align:center;">
            <table class="freshine-countdown-hero-stage" role="presentation" width="100%" height="722" cellpadding="0" cellspacing="0" border="0" style="width:100%;height:min(722px,120vw);border-collapse:collapse;">
              <tr>
                <td align="center" valign="middle" style="padding:0 10px;padding:0 min(10px,1.666667vw);text-align:center;vertical-align:middle;">
                  <table class="freshine-countdown-hero-panel" role="presentation" width="440" height="480" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="{{settings.color.panelFallback}}" style="width:100%;width:min(440px,73.333333vw);max-width:440px;height:80vw;max-height:480px;border-collapse:collapse;margin:0 auto;background-color:{{settings.color.panelTransparent}};">
                    <tr>
                      <td class="freshine-countdown-panel-content" align="center" valign="middle" style="padding:{{settings.panel.padding}};padding:min(28px,4.666667vw) min(24px,4vw);text-align:center;vertical-align:middle;">
                        <a href="{{content.brand.clickUrl}}" data-freshine-href-slot="brand.clickUrl" target="_blank" style="display:inline-block;line-height:0;text-align:center;text-decoration:none;"><img class="freshine-countdown-brand-logo" src="{{content.brand.logo.url}}" data-freshine-image-slot="brand.logo.url" width="108" alt="{{content.brand.logo.alt}}" border="0" style="display:block;width:100%;max-width:{{settings.brand.logoWidth}};max-width:min(108px,18vw);height:auto;border:0;margin:0 auto;"></a>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td class="freshine-countdown-spacer-logo" height="8" style="height:8px;height:min(8px,1.333333vw);font-size:0;line-height:0;">&nbsp;</td></tr></table>
                        <img class="freshine-countdown-divider" src="{{content.decoration.dividerImage.url}}" data-freshine-image-slot="decoration.dividerImage.url" width="220" alt="{{content.decoration.dividerImage.alt}}" border="0" style="display:block;width:100%;max-width:{{settings.decoration.dividerWidth}};max-width:min(220px,36.666667vw);height:auto;border:0;margin:0 auto;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td class="freshine-countdown-spacer-divider" height="14" style="height:14px;height:min(14px,2.333333vw);font-size:0;line-height:0;">&nbsp;</td></tr></table>
                        <!-- FRESHINE_SLOT_START:countdown.title --><span class="freshine-countdown-title" data-freshine-slot="countdown.title" style="display:inline-block;width:280px;width:min(280px,46.666667vw);max-width:280px;max-width:min(280px,46.666667vw);white-space:normal;color:{{settings.color.heading}};font-family:{{settings.font.heading}};font-size:50px;font-size:min(50px,8.333333vw);font-weight:400;line-height:64px;line-height:min(64px,10.666667vw);letter-spacing:0px;text-align:center;">{{content.countdown.title}}</span><!-- FRESHINE_SLOT_END:countdown.title -->
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td class="freshine-countdown-spacer-title" height="22" style="height:22px;height:min(22px,3.666667vw);font-size:0;line-height:0;">&nbsp;</td></tr></table>
                        <!-- FRESHINE_SLOT_START:hero.subtitle --><span class="freshine-countdown-subtitle" data-freshine-slot="hero.subtitle" style="display:inline-block;max-width:390px;max-width:min(390px,65vw);color:{{settings.color.body}};font-family:{{settings.font.body}};font-size:14px;font-size:min(14px,2.333333vw);font-weight:500;line-height:21px;line-height:min(21px,3.5vw);text-align:center;">{{content.hero.subtitle}}</span><!-- FRESHINE_SLOT_END:hero.subtitle -->
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td class="freshine-countdown-spacer-subtitle" height="22" style="height:22px;height:min(22px,3.666667vw);font-size:0;line-height:0;">&nbsp;</td></tr></table>
                        <table class="freshine-countdown-cta" role="presentation" width="200" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:{{settings.cta.maxWidth}};max-width:min(200px,33.333333vw);border-collapse:separate;margin:0 auto;"><tr><td class="freshine-countdown-cta-cell" height="44" align="center" valign="middle" bgcolor="{{settings.color.theme}}" style="height:{{settings.cta.height}};height:min(44px,7.333333vw);background-color:{{settings.color.theme}};border:1px solid {{settings.color.theme}};border-radius:{{settings.radius.button}};text-align:center;vertical-align:middle;"><a class="freshine-countdown-cta-link" href="{{content.hero.cta.url}}" data-freshine-href-slot="hero.cta.url" target="_blank" style="display:block;color:{{settings.color.themeText}};font-family:{{settings.font.action}};font-size:16px;font-size:min(16px,2.666667vw);font-weight:500;line-height:{{settings.cta.height}};line-height:min(44px,7.333333vw);text-align:center;text-decoration:none;"><!-- FRESHINE_SLOT_START:hero.cta.text --><span data-freshine-slot="hero.cta.text">{{content.hero.cta.text}}</span><!-- FRESHINE_SLOT_END:hero.cta.text --></a></td></tr></table>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
