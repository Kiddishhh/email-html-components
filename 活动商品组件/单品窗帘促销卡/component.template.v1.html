<table class="freshine-component freshine-curtain-promotion-card" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.surface}}" style="width:100%;border-collapse:collapse;background-color:{{settings.color.surface}};">
  <tr>
    <td align="center" bgcolor="{{settings.color.surface}}" style="background-color:{{settings.color.surface}};text-align:center;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
        <tr>
          <td class="freshine-curtain-promotion-header" align="center" style="padding:{{settings.spacing.header}};color:{{settings.color.text}};text-align:center;">
            <!-- FRESHINE_SLOT_START:promotion.title -->
            <span class="freshine-curtain-promotion-title" data-freshine-slot="promotion.title" style="display:block;max-width:100%;color:{{settings.color.text}};word-break:break-word;overflow-wrap:anywhere;font-family:Lora, Georgia, Times New Roman, serif;font-size:30px;font-size:min(30px,5vw);font-weight:400;line-height:38px;line-height:min(38px,6.333333vw);letter-spacing:0px;text-align:center;">{{content.promotion.title}}</span>
            <!-- FRESHINE_SLOT_END:promotion.title -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="32" style="height:32px;height:min(32px,5.333333vw);font-size:0;line-height:0;">&nbsp;</td></tr></table>
            <!-- FRESHINE_SLOT_START:promotion.subtitle -->
            <span data-freshine-slot="promotion.subtitle" style="display:block;max-width:100%;word-break:break-word;overflow-wrap:anywhere;font-family:Montserrat, Arial, Helvetica, sans-serif;font-size:18px;font-size:min(18px,3vw);font-weight:500;line-height:27px;line-height:min(27px,4.5vw);letter-spacing:0px;text-align:center;color:{{settings.color.body}};">{{content.promotion.subtitle}}</span>
            <!-- FRESHINE_SLOT_END:promotion.subtitle -->
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:{{settings.spacing.content}};text-align:center;">
            <table role="presentation" width="544" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:544px;border-collapse:collapse;margin:0 auto;">
              <tr>
                <td class="freshine-curtain-promotion-image" role="img" aria-label="{{content.product.image.alt}}" data-freshine-slot="product.image.alt" background="{{content.product.image.url}}" width="544" height="371" align="left" valign="top" bgcolor="{{settings.color.surface}}" style="width:100%;height:371px;height:min(371px,61.833333vw);background-color:{{settings.color.surface}};background-image:url('{{content.product.image.url}}');background-position:center center;background-repeat:no-repeat;background-size:cover;text-align:left;vertical-align:top;">
                  <!-- FRESHINE_SLOT_START:product.image -->
                  <table role="presentation" width="100%" height="371" cellpadding="0" cellspacing="0" border="0" style="width:100%;height:371px;height:min(371px,61.833333vw);border-collapse:collapse;">
                    <tr>
                      <td align="left" valign="top" style="text-align:left;vertical-align:top;">
                        <table role="presentation" align="left" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;"><tr><td bgcolor="{{settings.color.badge}}" style="padding:8px 16px 8px;padding:min(8px,1.333333vw) min(16px,2.666667vw) min(8px,1.333333vw);background-color:{{settings.color.badge}};border-radius:{{settings.radius.badge}};">
                          <a href="{{content.product.image.clickUrl}}" data-freshine-href-slot="product.image.clickUrl" target="_blank" style="display:block;color:{{settings.color.badgeText}};font-family:{{settings.font.action}};font-size:18px;font-size:min(18px,3vw);font-weight:500;line-height:27px;line-height:min(27px,4.5vw);text-decoration:none;">
                            <!-- FRESHINE_SLOT_START:product.badge --><span data-freshine-slot="product.badge" style="color:{{settings.color.badgeText}};font-family:{{settings.font.action}};font-size:18px;font-size:min(18px,3vw);font-weight:500;line-height:27px;line-height:min(27px,4.5vw);white-space:nowrap;">{{content.product.badge}}</span><!-- FRESHINE_SLOT_END:product.badge -->
                          </a>
                        </td></tr></table>
                      </td>
                    </tr>
                    <tr><td height="320" valign="bottom" style="height:320px;height:min(320px,53.333333vw);vertical-align:bottom;"><a href="{{content.product.image.clickUrl}}" target="_blank" aria-label="{{content.product.image.alt}}" style="display:block;height:320px;height:min(320px,53.333333vw);font-size:0;line-height:320px;line-height:min(320px,53.333333vw);text-decoration:none;">&nbsp;</a></td></tr>
                  </table>
                  <!-- FRESHINE_SLOT_END:product.image -->
                </td>
              </tr>
              <tr><td height="30" style="height:30px;height:min(30px,5vw);font-size:0;line-height:0;">&nbsp;</td></tr>
              <tr>
                <td align="left" style="padding:0 2px;padding:0 min(2px,0.333333vw);color:{{settings.color.text}};text-align:left;">
                  <!-- FRESHINE_SLOT_START:product.title -->
                  <a href="{{content.product.image.clickUrl}}" data-freshine-href-slot="product.image.clickUrl" target="_blank" style="color:{{settings.color.text}};font-family:{{settings.font.body}};font-size:22px;font-size:min(22px,3.666667vw);font-weight:500;line-height:30px;line-height:min(30px,5vw);text-align:left;text-decoration:none;"><span data-freshine-slot="product.title" style="display:block;color:{{settings.color.text}};word-break:break-word;overflow-wrap:anywhere;font-family:Montserrat, Arial, Helvetica, sans-serif;font-size:16px;font-size:min(16px,2.666667vw);font-weight:500;line-height:20px;line-height:min(20px,3.333333vw);letter-spacing:0px;text-align:left;">{{content.product.title}}</span></a>
                  <!-- FRESHINE_SLOT_END:product.title -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="15" style="height:15px;height:min(15px,2.5vw);font-size:0;line-height:0;">&nbsp;</td></tr></table>
                  <!-- FRESHINE_SLOT_START:product.description -->
                  <span data-freshine-slot="product.description" style="display:inline-block;max-width:100%;color:{{settings.color.body}};font-family:{{settings.font.body}};font-size:15px;font-size:min(15px,2.5vw);font-weight:400;line-height:22px;line-height:min(22px,3.666667vw);text-align:left;word-break:break-word;overflow-wrap:anywhere;">{{content.product.description}}</span>
                  <!-- FRESHINE_SLOT_END:product.description -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="18" style="height:18px;height:min(18px,3vw);font-size:0;line-height:0;">&nbsp;</td></tr></table>
                  <a href="{{content.product.cta.url}}" data-freshine-href-slot="product.cta.url" target="_blank" style="color:{{settings.color.text}};font-family:{{settings.font.action}};font-size:18px;font-size:min(18px,3vw);font-weight:500;line-height:27px;line-height:min(27px,4.5vw);text-align:left;text-decoration:underline;">
                    <!-- FRESHINE_SLOT_START:product.cta.text --><span data-freshine-slot="product.cta.text" style="color:{{settings.color.text}};font-family:{{settings.font.action}};font-size:18px;font-size:min(18px,3vw);font-weight:500;line-height:27px;line-height:min(27px,4.5vw);white-space:nowrap;">{{content.product.cta.text}}</span><!-- FRESHINE_SLOT_END:product.cta.text -->
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
