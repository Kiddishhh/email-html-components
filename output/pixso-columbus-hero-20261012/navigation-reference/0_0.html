<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixso HTML</title>
  <style>
:root, 
[data-collection-0-3-mode=""] {
  /* 参数 */
  --sm: 14px;
}

:root, 
[data-collection-0-7-mode=""] {
  /* 参数 */
  --primary-text: rgba(255, 255, 255, 1);
  --primary: rgba(141, 27, 27, 1);
}


* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

ol,ul,menu {
  padding-inline-start: 0;
  list-style: none;
}

ol li::marker, ul li::before {
  letter-spacing: 0;
}

.scroll-container > div {
  width: 100%;
}

.container > div {
  width: 100%;
}

.design-canvas > div {
  width: 100%;
}

html {
  width: 100%;
  height: 100%;
}

body { 
  width: 100%;
  height: 100%;
  margin: 0;
  background-color: white;
}
    
span {
  word-break: break-word;
}

.container {
  width: 100%;
  height: 100%;
}

.scroll-container {
  height: 100%;
  width: 100%;
  overflow: auto;
}

.design-canvas,.signup-navigation {
  width: 100%;
  position: relative;
  flex-shrink: 0;
}

.design-canvas {
  height: 100%;
}

.signup-navigation {
  height: 56px;
  min-width: 600px;
  overflow: hidden;
  background-color: var(--primary);
}

.signup-message,.signup-link {
  font-size: var(--sm);
  font-family: "Verdana-Regular";
  font-weight: 400;
  letter-spacing: 0px;
  color: var(--primary-text);
  width: auto;
  height: auto;
  position: absolute;
  left: 50%;
  top: 50%;
  white-space: pre;
  flex-grow: 0;
}

.signup-message {
  text-align: left;
  text-decoration: none;
  text-transform: uppercase;
  transform: translateX(calc(-50% + -46.5px)) translateY(calc(-50% + 0.5px));
}

.signup-link {
  text-align: center;
  text-decoration: underline;
  text-transform: capitalize;
  transform: translateX(calc(-50% + 241.5px)) translateY(calc(-50% + 0.5px));
}


  </style>
</head>
<body>
<div class="scroll-container">
  <div class="design-canvas">
    <div class="signup-navigation">
      <p class="signup-message">Unlock an Extra 15% Off Your First Order at Freshine</p>
      <p class="signup-link">SIGN UP</p>
    </div>
  </div>
</div>


<script>

</script>

</body>
</html>
