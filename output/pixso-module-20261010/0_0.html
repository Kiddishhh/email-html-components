<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixso HTML</title>
  <style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

ol,ul,menu {
  padding-inline-start: 0;
  list-style: none;
}

ol li::marker, ul li::before {
  letter-spacing: 0;
}

.scroll-container > div {
  width: 100%;
}

.container > div {
  width: 100%;
}

.design-canvas > div {
  width: 100%;
}

html {
  width: 100%;
  height: 100%;
}

body { 
  width: 100%;
  height: 100%;
  margin: 0;
  background-color: white;
}
    
span {
  word-break: break-word;
}

.container {
  width: 100%;
  height: 100%;
}

.scroll-container {
  height: 100%;
  width: 100%;
  overflow: auto;
}

.design-canvas,.scene-background {
  width: 100%;
  position: relative;
  flex-shrink: 0;
}

.design-canvas {
  height: 100%;
}

.scene-background {
  height: 1075px;
  min-width: 600px;
  background-image: url("assets/images/d5d34edbe526613d4a5de93c638891b8a620d887.png");
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
}


  </style>
</head>
<body>
<div class="scroll-container">
  <div class="design-canvas">
    <div class="scene-background"></div>
  </div>
</div>



</body>
</html>
