<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.surface}}" style="width:100%;border-collapse:collapse;background-color:{{settings.color.surface}};">
  <tr>
    <td align="center" valign="top" bgcolor="{{settings.color.surface}}" style="padding:{{settings.spacing.outer}};background-color:{{settings.color.surface}};text-align:center;vertical-align:top;">
      <table class="freshine-component freshine-clickable-full-image" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:{{settings.image.maxWidth}};border-collapse:collapse;margin:0 auto;">
        <tr>
          <td align="center" valign="top" style="padding:0;text-align:center;vertical-align:top;">
            <!-- FRESHINE_SLOT_START:image -->
            <a href="{{content.image.linkUrl}}" data-freshine-href-slot="image.linkUrl" target="_blank" style="display:block;text-decoration:none;">
              <img src="{{content.image.url}}" alt="{{content.image.alt}}" width="100%" data-freshine-slot="image" style="display:block;width:100%;height:auto;border:0;outline:none;text-decoration:none;">
            </a>
            <!-- FRESHINE_SLOT_END:image -->
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
