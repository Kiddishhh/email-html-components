<table class="freshine-component freshine-promotional-overlay-hero" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.heroFallback}}" style="width:100%;border-collapse:collapse;background-color:{{settings.color.heroFallback}};">
  <!-- FRESHINE_IF_SETTING:navigation.visible -->
  <tr class="freshine-promotional-overlay-navigation">
    <td style="padding:0;">
      <table class="freshine-promotional-overlay-promotion" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;border-collapse:collapse;">
        <tr>
          <td class="freshine-promotional-overlay-navigation-left" width="75.5%" height="71" align="center" valign="middle" bgcolor="{{settings.color.theme}}" style="width:75.5%;height:71px;height:min(71px,11.833333vw);padding:0 18px;padding:0 min(18px,3vw);background-color:{{settings.color.theme}};color:{{settings.color.themeText}};text-align:center;vertical-align:middle;">
            <!-- FRESHINE_SLOT_START:promotion.text --><span data-freshine-slot="promotion.text" style="display:inline-block;color:{{settings.color.themeText}};font-family:{{settings.font.body}};font-size:18px;font-size:min(18px,3vw);font-weight:400;line-height:24px;line-height:min(24px,4vw);text-align:center;">{{content.promotion.text}}</span><!-- FRESHINE_SLOT_END:promotion.text -->
          </td>
          <td class="freshine-promotional-overlay-navigation-right" width="24.5%" height="71" align="center" valign="middle" bgcolor="{{settings.color.theme}}" style="width:24.5%;height:71px;height:min(71px,11.833333vw);padding:0 10px;padding:0 min(10px,1.666667vw);background-color:{{settings.color.theme}};text-align:center;vertical-align:middle;">
            <a href="{{content.promotion.url}}" data-freshine-href-slot="promotion.url" target="_blank" style="display:inline-block;color:{{settings.color.themeText}};font-family:{{settings.font.action}};font-size:18px;font-size:min(18px,3vw);font-weight:400;line-height:24px;line-height:min(24px,4vw);text-align:center;text-decoration:underline;"><!-- FRESHINE_SLOT_START:promotion.linkText --><span data-freshine-slot="promotion.linkText">{{content.promotion.linkText}}</span><!-- FRESHINE_SLOT_END:promotion.linkText --></a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <!-- FRESHINE_END_IF_SETTING:navigation.visible -->
  <tr>
    <td class="freshine-overlay-hero-background" role="img" aria-label="{{content.hero.backgroundImage.alt}}" background="{{content.hero.backgroundImage.url}}" height="722" align="center" valign="top" bgcolor="{{settings.color.heroFallback}}" style="display:block;height:120vw;max-height:722px;min-height:560px;background-color:{{settings.color.heroFallback}};background-image:url('{{content.hero.backgroundImage.url}}');background-position:{{settings.background.position}};background-repeat:no-repeat;background-size:cover;text-align:center;">
      <table role="presentation" width="100%" height="722" cellpadding="0" cellspacing="0" border="0" style="width:100%;height:100%;border-collapse:collapse;">
        <tr>
          <td align="center" valign="top" style="padding:{{settings.spacing.logoTop}} 24px 0;text-align:center;">
            <table class="freshine-overlay-hero-logo-badge" role="presentation" width="106" height="106" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="{{settings.color.logoBadge}}" style="width:106px;width:min(106px,17.666667vw);height:106px;height:min(106px,17.666667vw);border-collapse:separate;margin:0 auto;background-color:{{settings.color.logoBadge}};background-color:{{settings.color.logoBadgeTransparent}};border-radius:53px;border-radius:min(53px,8.833333vw);">
              <tr>
                <td width="106" height="106" align="center" valign="middle" style="width:106px;width:min(106px,17.666667vw);height:106px;height:min(106px,17.666667vw);text-align:center;vertical-align:middle;">
                  <a href="{{content.hero.logo.clickUrl}}" data-freshine-href-slot="hero.logo.clickUrl" target="_blank" style="display:inline-block;line-height:0;text-decoration:none;">
                    <!-- FRESHINE_SLOT_START:hero.logo -->
                    <img class="freshine-overlay-hero-logo" src="{{content.hero.logo.url}}" alt="{{content.hero.logo.alt}}" width="80" data-freshine-slot="hero.logo" style="display:block;width:80px;width:min(80px,13.333333vw);max-width:{{settings.logo.maxWidth}};height:auto;border:0;outline:none;text-decoration:none;">
                    <!-- FRESHINE_SLOT_END:hero.logo -->
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="font-size:0;line-height:0;">&nbsp;</td>
        </tr>
        <tr>
          <td align="center" valign="bottom" style="padding:0 10px {{settings.spacing.panelBottom}};text-align:center;vertical-align:bottom;">
            <table data-freshine-layer="editable-panel" class="freshine-overlay-hero-panel" role="presentation" width="472" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="{{settings.color.panelFallback}}" style="width:100%;max-width:{{settings.panel.maxWidth}};border-collapse:collapse;margin:0 auto;background-color:{{settings.color.panelTransparent}};">
              <tr>
                <td align="center" style="padding:{{settings.panel.padding}};text-align:center;">
                  <!-- FRESHINE_SLOT_START:hero.eyebrow -->
                  <span data-freshine-slot="hero.eyebrow" style="display:inline-block;max-width:100%;color:{{settings.color.body}};font-family:{{settings.font.heading}};font-size:18px;font-size:min(18px,3vw);font-weight:400;line-height:25px;line-height:min(25px,4.166667vw);text-align:center;word-break:break-word;overflow-wrap:anywhere;">{{content.hero.eyebrow}}</span>
                  <!-- FRESHINE_SLOT_END:hero.eyebrow -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="10" style="height:10px;height:min(10px,1.666667vw);font-size:0;line-height:0;">&nbsp;</td></tr></table>
                  <!-- FRESHINE_SLOT_START:hero.title -->
                  <span data-freshine-slot="hero.title" style="display:inline-block;max-width:100%;color:{{settings.color.heading}};font-family:{{settings.font.heading}};font-size:34px;font-size:min(34px,5.666667vw);font-weight:500;line-height:40px;line-height:min(40px,6.666667vw);text-align:center;word-break:normal;overflow-wrap:normal;">{{content.hero.title}}</span>
                  <!-- FRESHINE_SLOT_END:hero.title -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="12" style="height:12px;height:min(12px,2vw);font-size:0;line-height:0;">&nbsp;</td></tr></table>
                  <!-- FRESHINE_SLOT_START:hero.subtitle -->
                  <span data-freshine-slot="hero.subtitle" style="display:inline-block;max-width:100%;color:{{settings.color.body}};font-family:{{settings.font.body}};font-size:14px;font-size:min(14px,2.333333vw);font-weight:500;line-height:20px;line-height:min(20px,3.333333vw);text-align:center;word-break:break-word;overflow-wrap:anywhere;">{{content.hero.subtitle}}</span>
                  <!-- FRESHINE_SLOT_END:hero.subtitle -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="20" style="height:20px;height:min(20px,3.333333vw);font-size:0;line-height:0;">&nbsp;</td></tr></table>
                  <table role="presentation" width="252" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:{{settings.cta.maxWidth}};border-collapse:separate;margin:0 auto;">
                    <tr>
                      <td height="48" align="center" valign="middle" bgcolor="{{settings.color.theme}}" style="height:48px;height:min(48px,8vw);background-color:{{settings.color.theme}};border:1px solid {{settings.color.theme}};border-radius:{{settings.radius.button}};text-align:center;vertical-align:middle;">
                        <a href="{{content.hero.cta.url}}" data-freshine-href-slot="hero.cta.url" target="_blank" style="display:block;color:{{settings.color.themeText}};font-family:{{settings.font.action}};font-size:16px;font-size:min(16px,2.666667vw);font-weight:500;line-height:48px;line-height:min(48px,8vw);text-align:center;text-decoration:none;">
                          <!-- FRESHINE_SLOT_START:hero.cta.text --><span data-freshine-slot="hero.cta.text" style="color:{{settings.color.themeText}};font-family:{{settings.font.action}};font-size:16px;font-size:min(16px,2.666667vw);font-weight:500;line-height:20px;line-height:min(20px,3.333333vw);">{{content.hero.cta.text}}</span><!-- FRESHINE_SLOT_END:hero.cta.text -->
                        </a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
