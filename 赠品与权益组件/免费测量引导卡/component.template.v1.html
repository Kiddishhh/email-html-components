<table class="freshine-component freshine-free-measurement-guidance" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.surface}}" style="width:100%;border-collapse:collapse;background-color:{{settings.color.surface}};">
  <tr>
    <td align="center" valign="top" bgcolor="{{settings.color.surface}}" style="padding:0;background-color:{{settings.color.surface}};text-align:center;vertical-align:top;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:600px;border-collapse:collapse;margin:0 auto;">
        <tr><td height="48" style="height:48px;height:min(48px,8vw);font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td align="center" style="padding:0 20px;padding:0 min(20px,3.333333vw);color:{{settings.color.text}};text-align:center;">
          <span data-freshine-slot="guide.title" style="display:block;color:{{settings.color.text}};font-family:Montserrat,Arial,Helvetica,sans-serif;font-size:30px;font-size:min(30px,6.933333vw);font-weight:500;line-height:38px;line-height:min(38px,8.8vw);letter-spacing:0;text-align:center;word-break:break-word;overflow-wrap:anywhere;">{{content.guide.title}}</span>
        </td></tr>
        <tr><td height="18" style="height:18px;height:min(18px,3vw);font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td align="center" style="padding:0 20px;padding:0 min(20px,3.333333vw);color:#817875;text-align:center;">
          <span data-freshine-slot="guide.subtitle" style="display:block;color:#817875;font-family:Montserrat,Arial,Helvetica,sans-serif;font-size:18px;font-size:min(18px,4vw);font-weight:400;line-height:27px;line-height:min(27px,6vw);letter-spacing:0;text-align:center;word-break:break-word;overflow-wrap:anywhere;">{{content.guide.subtitle}}</span>
        </td></tr>
        <tr><td height="27" style="height:27px;height:min(27px,4.5vw);font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td align="center" valign="top" style="padding:0;text-align:center;vertical-align:top;">
          <!-- FRESHINE_SLOT_START:guide.image -->
          <a href="{{content.guide.image.clickUrl}}" data-freshine-href-slot="guide.image.clickUrl" target="_blank" style="display:block;text-decoration:none;"><img src="{{content.guide.image.url}}" alt="{{content.guide.image.alt}}" width="600" height="416" data-freshine-slot="guide.image" style="display:block;width:100%;max-width:600px;height:auto;border:0;outline:none;text-decoration:none;"></a>
          <!-- FRESHINE_SLOT_END:guide.image -->
        </td></tr>
      </table>
    </td>
  </tr>
</table>
