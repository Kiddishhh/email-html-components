  margin: 0;
  padding: 0;

  padding-inline-start: 0;
  list-style: none;
}

ol li::marker, ul li::before {
  letter-spacing: 0;
}

  width: 100%;
}

  width: 100%;
}

.design-canvas > div {
  width: 100%;
}

html {
  width: 100%;
  height: 100%;
}

body { 
  width: 100%;
  height: 100%;
  margin: 0;
  background-color: white;
}

}

  height: 100%;
}

  width: 100%;
  overflow: auto;
}

  position: relative;
  flex-shrink: 0;

.curtain-image {
  background-image: url("assets/images/Celinaextrawide1.png");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  right: 0px;
  margin-left: auto;
  margin-right: auto;
  top: 0px;
  bottom: 0px;
}

.copy-region,.copy-content {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.copy-region {
  width: 240px;
  height: auto;
  position: absolute;
  left: 35px;
  top: 78px;
}

.copy-content {
  gap: 16px;
  width: 100%;
  position: relative;
}

.eyebrow,.offer-heading,.offer-detail {
  text-align: left;
  letter-spacing: 0px;
  text-decoration: none;
  color: var(--accent-text);
  height: auto;
  position: relative;
  flex-shrink: 0;
  flex-grow: 0;
}

.eyebrow,.offer-heading {
  font-feature-settings: "locl" 0;
  width: 231px;
  white-space: pre;
}

.eyebrow {
  font-size: var(--lg);
  font-family: Lora,Georgia,serif;
  font-weight: 500;
}

.offer-heading {
  font-size: var(--3xl);
  font-family: Lora,Georgia,serif;
  font-weight: 400;
  text-transform: uppercase;
}

.offer-detail {
  font-size: 14px;
  font-family: Montserrat,Arial,sans-serif;
  font-weight: 500;
  line-height: 150%;
  text-transform: capitalize;
  width: 218px;
}

.shop-cta {
  width: 183px;
  height: 40px;
  position: relative;
  flex-shrink: 0;
}

.cta-background {
  width: 100%;
  height: 100%;
  position: relative;
  border-radius: 4px 4px 4px 4px;
  z-index: 0;
}

.cta-outline-wrapper {
  position: absolute;
  isolation: isolate;
  left: 0px;
  top: 0px;
  right: 0px;
  bottom: 0px;
  width: 183px;
  height: 40px;
  margin-bottom: auto;
  margin-left: auto;
  margin-right: auto;
  margin-top: auto;
}

.cta-outline {
  position: absolute;
  inset: -0.75px -0.75px -0.75px -0.75px;
  border-radius: 4px 4px 4px 4px;
  pointer-events: none;
  z-index: 1;
  border-width: 1.5px 1.5px 1.5px 1.5px;
  border-style: solid;
  box-sizing: border-box;
  border-color: var(--accent-text);
}

.cta-label {
  font-size: var(--base);
  font-family: Montserrat,Arial,sans-serif;
  font-weight: 600;
  text-align: center;
  letter-spacing: 0px;
  text-decoration: none;
  text-transform: uppercase;
  color: var(--accent-text);
  width: auto;
  height: auto;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translateX(calc(-50% + 0px)) translateY(calc(-50% + -0.5px));
  white-space: pre;
  flex-grow: 0;
}


  </style>
</head>
<body>
<div class="scroll-container">
  <div class="design-canvas">
    <div class="complete-hero">
      <div class="hero-background">
        <div class="image-region">
          <div class="image-mask">
            <div class="curtain-image"></div>
          </div>
        </div>
      </div>
      <div class="copy-region">
        <div class="copy-content">
          <p class="eyebrow">Cozy Fall Living</p>
          <h2 class="offer-heading">UP TO 65% OFF</h2>
          <p class="offer-detail">EXTRA $600 OFF &amp; UP TO 20% OFF SITEWIDE</p>
          <a class="shop-cta" href="https://freshinelife.com/pages/freshine-sale?utm_source=omnisend&amp;utm_medium=email&amp;utm_id=cover-rc" style="display:block;text-decoration:none;">
            <div class="cta-outline-wrapper">
              <div class="cta-background"></div>
              <div class="cta-outline"></div>
            </div>
            <span class="cta-label">Shop Now</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
