  <style>

* {

  margin: 0;
  padding: 0;
}

ol,ul,menu {

  list-style: none;
}

}

.scroll-container > div {

  width: 100%;
}

.design-canvas > div {

}

html {
  width: 100%;
  height: 100%;
}

  height: 100%;
  margin: 0;

}

.headline-art,.headline-group,.campaign-word,.sale-word {
  width: 494.000031px;
  position: absolute;
}

.headline-art {
  height: 712.210205px;
  left: 0.00001549999998928797px;
  right: -0.00001549999998928797px;
  top: 36px;
}

.headline-group {
  height: 712.210205px;
  top: 0px;
}

.campaign-word,.sale-word {
  height: 207.210175px;
  background-image: url("assets/images/db914772e7882a69cc057ffd4cd9fcde0488faa1.png");
  background-size: 100.0000% 436.0567%;
}

.campaign-word {

  background-position: 0.00px -0.32px;
}

.sale-word {

  background-position: 0.00px -645.24px;
}

.shop-cta,.cta-outline-wrap {
  width: 242px;
  height: 52px;
  margin-top: auto;
  margin-bottom: auto;
}

.shop-cta {
  position: absolute;
  top: 372.5px;
  bottom: -372.5px;
}

.cta-shape {
  width: 100%;
  height: 100%;
  position: relative;
  border-radius: 34px 34px 34px 34px;
  z-index: 0;
}

.cta-outline-wrap {
  position: absolute;
  isolation: isolate;
  top: 0px;
  bottom: 0px;
}

.cta-outline {
  position: absolute;
  inset: -0.5px -0.5px -0.5px -0.5px;
  border-radius: 34px 34px 34px 34px;
  pointer-events: none;
  z-index: 1;
  border-width: 1px 1px 1px 1px;
  border-style: solid;
  box-sizing: border-box;
  border-color: var(--primary-text);
}

.cta-label,.camera-art {
  position: absolute;
}

.cta-label {
  font-size: var(--lg);
  font-family: "Montserrat";
  font-weight: 600;
  text-align: center;
  letter-spacing: 0px;
  font-feature-settings: "locl" 0;
  text-decoration: none;
  text-transform: uppercase;
  color: var(--primary-text);
  width: 240px;
  height: auto;
  left: -1px;
  right: 1px;
  top: 50%;
  transform: translateY(calc(-50% + 1.0007319999999993px));
  white-space: pre;
}

.camera-art,.camera-wrap {
  width: 397px;
  height: 276px;
}

.camera-art {
  top: 243px;
}

.camera-image {
  position: absolute;
  inset: 0% -0.5037783375314862% -1.4492753623188406% -0.5037783375314862% ;
  background-image: url("assets/images/Rectangle_243_3986.png");
  background-size: 100% 100%;
  background-repeat: no-repeat;
}

.camera-wrap {
  position: absolute;
  left: 0px;
  right: 0px;
  top: 0px;
}

<body>
<div class="scroll-container">
  <div class="design-canvas">
    <div class="campaign-hero">

      <div class="right-photo-mask"></div>
      <div class="left-photo-mask"></div>
      <div class="room-photo"></div>
      <div class="bottom-shade"></div>
      <div class="top-shade"></div>
      <div class="headline-art">
        <div class="headline-group">
          <div class="campaign-word"></div>
          <div class="sale-word"></div>
        </div>
      </div>
      <div class="shop-cta">
        <div class="cta-outline-wrap">
          <div class="cta-shape"></div>
          <div class="cta-outline"></div>
        </div>
        <p class="cta-label">Shop Now</p>
      </div>
      <div class="camera-art">
        <div class="camera-wrap">
          <div class="camera-image"></div>
        </div>
      </div>
    </div>
  </div>
</div>
