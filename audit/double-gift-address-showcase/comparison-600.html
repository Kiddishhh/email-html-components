<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>双赠品展示卡2 600px 对照</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #ececec; color: #1f1f1f; font-family: Arial, sans-serif; }
      main { display: flex; gap: 16px; padding: 16px; width: 1232px; }
      figure { margin: 0; width: 600px; }
      figcaption { height: 28px; font-size: 14px; line-height: 20px; }
      img { display: block; width: 600px; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>参考设计稿 · 600px</figcaption>
        <img src="reference-600.png" width="600" height="489" alt="600px 参考设计稿">
      </figure>
      <figure>
        <figcaption>本地实现 · 600px</figcaption>
        <img src="implementation-600.png" width="600" height="488" alt="600px 本地实现">
      </figure>
    </main>
  </body>
</html>
