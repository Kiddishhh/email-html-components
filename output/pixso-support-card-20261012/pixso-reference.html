  border-radius: 8px 8px 8px 8px;

}

.card-outline-wrapper {
  position: absolute;

  top: 0px;
  right: 0px;

  height: 135px;
  margin-left: auto;
  margin-right: auto;
}

.card-outline {
  position: absolute;

  z-index: 1;
  border-width: 1px 1px 1px 1px;

  box-sizing: border-box;
  border-color: var(--base);
}

.support-copy,.support-copy-content {
