<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixso HTML</title>
  <style>
@font-face {
	font-family: 'Montserrat';
	font-style: normal;
	font-weight: 700;
	src: url(fonts/Montserrat-Bold_1.ttf) format('truetype');
}

@font-face {
	font-family: 'Montserrat';
	font-style: normal;
	font-weight: 600;
	src: url(fonts/Montserrat-SemiBold_1.ttf) format('truetype');
}

@font-face {
	font-family: 'Lora';
	font-style: normal;
	font-weight: 500;
	src: url(fonts/Lora-Medium.ttf) format('truetype');
}
</style>
  
  <style>
:root, 
[data-collection-0-7-mode=""] {
  /* 参数 */
  --primary-text: rgba(255, 255, 255, 1);
}


* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

ol,ul,menu {
  padding-inline-start: 0;
  list-style: none;
}

ol li::marker, ul li::before {
  letter-spacing: 0;
}

.scroll-container > div {
  width: 100%;
}

.container > div {
  width: 100%;
}

.design-canvas > div {
  width: 100%;
}

html {
  width: 100%;
  height: 100%;
}

body { 
  width: 100%;
  height: 100%;
  margin: 0;
  background-color: white;
}
    
span {
  word-break: break-word;
}

.container {
  width: 100%;
  height: 100%;
}

.scroll-container {
  height: 100%;
  width: 100%;
  overflow: auto;
}

.design-canvas,.discount-hero {
  width: 100%;
  position: relative;
  flex-shrink: 0;
}

.design-canvas {
  height: 100%;
}

.discount-hero {
  height: 558px;
  min-width: 600px;
  overflow: hidden;
  background-color: rgba(255, 255, 255, 1);
}

.room-background {
  width: 1490px;
  height: 558px;
  position: absolute;
  left: -745px;
  right: auto;
  margin-left: auto;
  margin-right: auto;
  top: -0.0009770000000172113px;
  bottom: 0.0009770000000172113px;
  margin-top: auto;
  margin-bottom: auto;
  background-image: url("../assets/background-original.png");
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center;
}

.offer-panel,.panel-surface {
  width: 458px;
  height: 464px;
  position: absolute;
}

.offer-panel {
  left: 71px;
  top: 46.999023px;
}

.panel-surface {
  left: 0px;
  top: 0px;
  border-radius: 17px 17px 17px 17px;
  background-color: rgba(255, 255, 255, 1);
  opacity: 0.8;
}

.collection-button,.button-surface {
  width: 297px;
  height: 55px;
  position: absolute;
  margin-left: auto;
  margin-right: auto;
}

.collection-button {
  left: -0.5px;
  right: 0.5px;
  top: 373px;
}

.button-surface {
  left: 0px;
  right: 0px;
  top: 0px;
  background-color: rgba(164, 98, 41, 1);
}

.button-label,.offer-heading {
  text-align: center;
  letter-spacing: 0px;
  text-decoration: none;
  width: auto;
  height: auto;
  position: absolute;
  left: 50%;
  top: 50%;
  white-space: pre;
  flex-grow: 0;
}

.button-label {
  font-size: 16px;
  font-family: "Montserrat";
  font-weight: 600;
  text-transform: uppercase;
  color: var(--primary-text);
  transform: translateX(calc(-50% + -1.4273379999999953px)) translateY(calc(-50% + 1px));
}

.offer-heading {
  font-size: 29px;
  font-family: "Lora";
  font-weight: 500;
  text-transform: capitalize;
  color: rgba(107, 73, 44, 1);
  transform: translateX(calc(-50% + -1.5px)) translateY(calc(-50% + -77.5px));
}

.discount-art {
  width: 385px;
  height: 158px;
  position: absolute;
  left: 36px;
  top: 190px;
}

.coupon-outline {
  width: 385px;
  height: 141px;
  background-image: url("assets/images/Vector_119_2627.svg");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  position: absolute;
  left: 0px;
  right: 0px;
  margin-left: auto;
  margin-right: auto;
  top: 0px;
}

.coupon-tab {
  width: 100%;
  height: 100%;
  position: relative;
  border-radius: 2px 2px 2px 2px;
  z-index: 0;
}

.coupon-tab-wrapper {
  position: absolute;
  isolation: isolate;
  left: 0px;
  top: 121px;
  right: 0px;
  width: 131px;
  height: 37px;
  margin-left: auto;
  margin-right: auto;
}

.coupon-tab-border {
  position: absolute;
  inset: 0px;
  border-radius: 2px 2px 2px 2px;
  pointer-events: none;
  z-index: 1;
  border-width: 1.5px 1.5px 1.5px 1.5px;
  border-style: dashed;
  box-sizing: border-box;
  border-color: rgba(107, 73, 44, 1);
}

.sitewide-label,.extra-amount,.extra-label,.offer-plus,.upto-label {
  font-family: "Montserrat";
  font-weight: 600;
  text-align: center;
  text-decoration: none;
  text-transform: capitalize;
  color: rgba(107, 73, 44, 1);
  width: auto;
  height: auto;
  position: absolute;
  white-space: pre;
  flex-grow: 0;
}

.sitewide-label {
  font-size: 18px;
  letter-spacing: 0px;
  line-height: 150%;
  left: 50%;
  top: 126px;
  transform: translateX(calc(-50% + 0px));
}

.extra-amount {
  font-size: 63px;
  letter-spacing: -3px;
  left: 50%;
  top: 50%;
  transform: translateX(calc(-50% + -87px)) translateY(calc(-50% + 1.5px));
}

.extra-label,.offer-plus,.upto-label {
  letter-spacing: 0px;
  line-height: 150%;
}

.extra-label {
  font-size: 20px;
  left: 50%;
  top: 15px;
  transform: translateX(calc(-50% + -87px));
}

.offer-plus {
  font-size: 34px;
  left: 196px;
  top: 55px;
}

.upto-label {
  font-size: 20px;
  left: 50%;
  top: 15px;
  transform: translateX(calc(-50% + 99px));
}

.percent-off {
  width: 124px;
  height: 77px;
  position: absolute;
  left: 99.5px;
  right: -99.5px;
  margin-left: auto;
  margin-right: auto;
  top: 42px;
}

.percent-value,.percent-sign,.off-label {
  text-align: center;
  letter-spacing: 0px;
  text-decoration: none;
  color: rgba(107, 73, 44, 1);
  width: auto;
  height: auto;
  position: absolute;
  left: 50%;
  top: 50%;
  white-space: pre;
  flex-grow: 0;
}

.percent-value {
  font-size: 63px;
  font-family: "Montserrat";
  font-weight: 600;
  text-transform: capitalize;
  transform: translateX(calc(-50% + -22.5px)) translateY(calc(-50% + 0px));
}

.percent-sign {
  font-size: 40px;
  font-family: "Montserrat";
  font-weight: 700;
  text-transform: capitalize;
  transform: translateX(calc(-50% + 42.5px)) translateY(calc(-50% + -8px));
}

.off-label {
  font-size: 18px;
  font-family: "Montserrat";
  font-weight: 700;
  text-transform: uppercase;
  transform: translateX(calc(-50% + 42.5px)) translateY(calc(-50% + 16.5px));
}


  </style>
</head>
<body>
<div class="scroll-container">
  <div class="design-canvas">
    <div class="discount-hero">
      <div class="room-background"></div>
      <div class="offer-panel">
        <div class="panel-surface"></div>
        <div class="collection-button">
          <div class="button-surface"></div>
          <p class="button-label">SHOP THE COLLECTION</p>
        </div>
        <p class="offer-heading">Your Exclusive Discount</p>
        <div class="discount-art">
          <div class="coupon-outline"></div>
          <div class="coupon-tab-wrapper">
            <div class="coupon-tab"></div>
            <div class="coupon-tab-border"></div>
          </div>
          <p class="sitewide-label">SITEWIDE</p>
          <p class="extra-amount">$600</p>
          <p class="extra-label">EXTRA</p>
          <p class="offer-plus">+</p>
          <p class="upto-label">UP TO</p>
          <div class="percent-off">
            <p class="percent-value">20</p>
            <p class="percent-sign">%</p>
            <p class="off-label">off</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>




<img alt="Freshine" src="../assets/logo.png" style="position:absolute;left:256px;top:80px;width:87px;height:87px;">
</body>
</html>
