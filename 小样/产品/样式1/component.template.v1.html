<table class="freshine-component freshine-product-style1" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.surface}}" style="width:100%;max-width:{{settings.content.maxWidth}};border-collapse:collapse;background-color:{{settings.color.surface}};">
  <tr>
    <td align="center" valign="top" style="padding:26px {{settings.spacing.horizontal}} 0;text-align:center;vertical-align:top;">
      <!-- FRESHINE_SLOT_START:product.mainImage.url -->
      <img class="freshine-product-style1-image" src="{{content.product.mainImage.url}}" alt="{{content.product.mainImage.alt}}" width="548" data-freshine-slot="product.mainImage.url" style="display:block;width:100%;max-width:{{settings.image.mainWidth}};height:auto;border:0;outline:none;text-decoration:none;">
      <!-- FRESHINE_SLOT_END:product.mainImage.url -->
    </td>
  </tr>
  <tr>
    <td align="center" valign="top" style="padding:0 {{settings.spacing.horizontal}};text-align:center;vertical-align:top;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:{{settings.image.mainWidth}};border-collapse:collapse;">
        <tr>
          <td width="58%" align="left" valign="top" style="width:58%;padding:40px 0 54px;text-align:left;vertical-align:top;">
            <!-- FRESHINE_SLOT_START:product.title -->
            <span data-freshine-slot="product.title" style="display:block;color:{{settings.color.title}};font-family:{{settings.font.body}};font-size:30px;font-weight:700;line-height:36px;text-align:left;">{{content.product.title}}</span>
            <!-- FRESHINE_SLOT_END:product.title -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="14" style="height:14px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
            <!-- FRESHINE_SLOT_START:product.subtitle -->
            <span data-freshine-slot="product.subtitle" style="display:block;color:{{settings.color.subtitle}};font-family:{{settings.font.body}};font-size:22px;font-weight:400;line-height:31px;text-align:left;">{{content.product.subtitle}}</span>
            <!-- FRESHINE_SLOT_END:product.subtitle -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="30" style="height:30px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
            <table role="presentation" width="278" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:278px;border-collapse:collapse;">
              <tr>
                <td height="48" align="center" valign="middle" style="height:48px;border:2px solid {{settings.color.action}};text-align:center;vertical-align:middle;">
                  <a class="freshine-product-style1-cta" href="{{content.product.cta.url}}" data-freshine-href-slot="product.cta.url" target="_blank" style="display:block;color:{{settings.color.action}};font-family:{{settings.font.body}};font-size:18px;font-weight:400;line-height:48px;text-align:center;text-decoration:none;">
                    <!-- FRESHINE_SLOT_START:product.cta.text --><span data-freshine-slot="product.cta.text">{{content.product.cta.text}}</span><!-- FRESHINE_SLOT_END:product.cta.text -->
                  </a>
                </td>
              </tr>
            </table>
          </td>
          <td width="42%" align="right" valign="top" style="width:42%;padding:0;text-align:right;vertical-align:top;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" align="right" bgcolor="{{settings.color.detailShadow}}" style="width:100%;max-width:{{settings.image.detailWidth}};border-collapse:collapse;margin-top:-{{settings.spacing.detailOverlap}};background-color:{{settings.color.detailShadow}};">
              <tr>
                <td style="padding:0 {{settings.spacing.detailShadow}} {{settings.spacing.detailShadow}} 0;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.detailFrame}}" style="width:100%;max-width:197px;border-collapse:collapse;background-color:{{settings.color.detailFrame}};">
                    <tr>
                      <td style="padding:8px;">
                        <!-- FRESHINE_SLOT_START:product.detailImage.url -->
                        <img class="freshine-product-style1-image" src="{{content.product.detailImage.url}}" alt="{{content.product.detailImage.alt}}" width="181" data-freshine-slot="product.detailImage.url" style="display:block;width:100%;max-width:181px;height:auto;border:0;outline:none;text-decoration:none;">
                        <!-- FRESHINE_SLOT_END:product.detailImage.url -->
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
