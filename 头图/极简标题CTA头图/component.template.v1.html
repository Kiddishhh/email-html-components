<table class="freshine-minimal-title-cta" role="presentation" width="600" align="center" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.surface}}" style="width:100%;max-width:600px;border-collapse:collapse;margin:0 auto;background-color:{{settings.color.surface}};">
  <tr>
    <td align="center" valign="top" bgcolor="{{settings.color.surface}}" style="padding:36px 47px 40px 47px;padding:min(36px,6vw) min(47px,7.833333vw) min(40px,6.666667vw) min(47px,7.833333vw);background-color:{{settings.color.surface}};text-align:center;vertical-align:top;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
        <tr>
          <td class="freshine-minimal-title" align="center" style="padding:0;text-align:center;color:{{settings.color.title}};font-family:Lora,Georgia,'Times New Roman',serif;font-size:36px;font-size:min(36px,6vw);font-weight:400;line-height:54px;line-height:min(54px,9vw);letter-spacing:0px;">
            <!-- FRESHINE_SLOT_START:hero.title --><span data-freshine-slot="hero.title">{{content.hero.title}}</span><!-- FRESHINE_SLOT_END:hero.title -->
          </td>
        </tr>
        <tr>
          <td class="freshine-minimal-subtitle" align="center" style="padding:24px 0 0 0;padding:min(24px,4vw) 0 0 0;text-align:center;color:{{settings.color.body}};font-family:Montserrat,Arial,Helvetica,sans-serif;font-size:16px;font-size:min(16px,2.666667vw);font-weight:500;line-height:24px;line-height:min(24px,4vw);letter-spacing:0px;">
            <!-- FRESHINE_SLOT_START:hero.subtitle --><span data-freshine-slot="hero.subtitle">{{content.hero.subtitle}}</span><!-- FRESHINE_SLOT_END:hero.subtitle -->
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 0 0 0;padding:min(24px,4vw) 0 0 0;text-align:center;">
            <table class="freshine-minimal-cta" role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;margin:0 auto;">
              <tr>
                <td align="center" valign="middle" bgcolor="{{settings.color.action}}" style="background-color:{{settings.color.action}};border-radius:2px;border-radius:min(2px,0.333333vw);text-align:center;vertical-align:middle;">
                  <a href="{{content.hero.cta.url}}" data-freshine-href-slot="hero.cta.url" target="_blank" style="display:block;padding:13px 30px;padding:min(13px,2.166667vw) min(30px,5vw);color:#FFFFFF;font-family:Montserrat,Arial,Helvetica,sans-serif;font-size:16px;font-size:min(16px,2.666667vw);font-weight:600;line-height:20px;line-height:min(20px,3.333333vw);letter-spacing:1px;text-align:center;text-decoration:none;">
                    <!-- FRESHINE_SLOT_START:hero.cta.text --><span data-freshine-slot="hero.cta.text">{{content.hero.cta.text}}</span><!-- FRESHINE_SLOT_END:hero.cta.text -->
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:28px 0 0 0;padding:min(28px,4.666667vw) 0 0 0;text-align:center;">
            <a href="{{content.hero.image.clickUrl}}" data-freshine-href-slot="hero.image.clickUrl" target="_blank" style="display:block;line-height:0;text-decoration:none;">
              <!-- FRESHINE_SLOT_START:hero.image --><img src="{{content.hero.image.url}}" alt="{{content.hero.image.alt}}" data-freshine-slot="hero.image" width="506" style="display:block;width:100%;max-width:506px;height:auto;border:0;outline:none;text-decoration:none;"><!-- FRESHINE_SLOT_END:hero.image -->
            </a>
          </td>
        </tr>
      </table>
      <p style="margin:0;padding:0;font-size:0;line-height:0;"></p>
    </td>
  </tr>
</table>
