  <style>
:root, 
[data-collection-0-3-mode=""] {
  /* 参数 */
  --5xl: 48px;
}

:root, 
[data-collection-0-7-mode=""] {
  /* 参数 */
  --accent-text: rgba(31, 31, 31, 1);
}


* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

ol,ul,menu {
  padding-inline-start: 0;
  list-style: none;
}

ol li::marker, ul li::before {
  letter-spacing: 0;
}

.scroll-container > div {
  width: 100%;
}

.container > div {
  width: 100%;
}

.design-canvas > div {
  width: 100%;
}

html {
  width: 100%;
  height: 100%;
}

body { 
  width: 100%;
  height: 100%;
  margin: 0;
  background-color: white;
}
    
span {
  word-break: break-word;
}

.container {
  width: 100%;
  height: 100%;
}

.scroll-container {
  height: 100%;
  width: 100%;
  overflow: auto;
}

.design-canvas,.fit-hero {
  width: 100%;
  position: relative;
  flex-shrink: 0;
}

.design-canvas {
  height: 100%;
}

.fit-hero {
  height: 790px;
  min-width: 600px;
}

.hero-surface {
  width: 600px;
  height: 790px;
  overflow: hidden;
  position: absolute;
  left: 0px;
  top: 0px;
  background-color: rgba(255, 255, 255, 1);
}

.scene-crop,.scene-image,.hero-description,.measuring-cta,.cta-border-wrap {
  margin-left: auto;
  margin-right: auto;
}

.scene-crop,.scene-image,.hero-title,.signup-offer,.signup-label {
  position: absolute;
}

.hero-title,.signup-offer,.signup-label,.hero-description,.cta-label {
  letter-spacing: 0px;
  text-decoration: none;
  color: var(--accent-text);
  height: auto;
}

.hero-title,.signup-offer,.signup-label,.cta-label {
  width: auto;
  white-space: pre;
  flex-grow: 0;
}

.hero-title {
  font-size: var(--5xl);
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 700;
  text-align: center;
  left: 50%;
  top: 134px;
  transform: translateX(calc(-50% + 1.5px));
}

.signup-offer,.signup-label,.hero-description,.cta-label {
  font-family: Verdana, Arial, sans-serif;
  font-weight: 400;
}

.signup-offer,.signup-label {
  text-align: left;
  top: 44px;
}

.signup-offer {
  font-size: 14px;
  left: 32px;
}

.signup-label {
  font-size: 14px;
  left: 481px;
}

.hero-description,.measuring-cta {
  left: 1.5px;
  right: -1.5px;
}

.hero-description {
  font-size: 14px;
  text-align: center;
  line-height: 150%;
  width: 489px;
  position: absolute;
  top: 210px;
}

.nav-divider {
  height: 1px;
  background-image: url("assets/images/Vector_273_171.svg");
  background-size: 100% 100%;
  position: absolute;
  left: 32px;
  top: 73px;
}

.measuring-cta,.cta-border-wrap {
  width: 353px;
  height: 55px;
}

.measuring-cta {
  position: absolute;
  top: 688px;
}

.cta-surface {
  width: 100%;
  height: 100%;
  position: relative;
  z-index: 0;
}

.cta-border-wrap {
  position: absolute;
  isolation: isolate;
  left: 0px;
  top: 0px;
  right: 0px;
}

.cta-border {
  position: absolute;
  inset: 0px;
  border-radius: 0px 0px 0px 0px;
  pointer-events: none;
  z-index: 1;
  border-width: 1px 1px 1px 1px;
  border-style: solid;
  box-sizing: border-box;
  border-color: var(--accent-text);
}

.cta-label {
  font-size: 16px;
  text-align: center;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translateX(calc(-50% + -0.21557599999999866px)) translateY(calc(-50% + 0px));
}

</head>
<body>
<div class="scroll-container">
  <div class="design-canvas">
    <div class="fit-hero">
      <div class="hero-surface">
        <div class="scene-crop">
          <div class="scene-image"></div>
        </div>
        <p class="hero-title">Your Perfect Fit</p>
        <p class="signup-offer">Unlock Extra 15% Off Your First Order at Freshine</p>
        <p class="signup-label">&gt;&gt; SIGN UP</p>
        <p class="hero-description">Every window is different. Measure once with our free tool and get shades made just for yours.</p>
        <div class="nav-divider"></div>
        <div class="measuring-cta">
          <div class="cta-border-wrap">
            <div class="cta-surface"></div>
            <div class="cta-border"></div>
          </div>
          <p class="cta-label">START MEASURING</p>
        </div>
      </div>
    </div>
  </div>
</div>
