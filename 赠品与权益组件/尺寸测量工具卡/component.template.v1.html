<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.surface}}" style="width:100%;border-collapse:collapse;background-color:{{settings.color.surface}};">
  <tr>
    <td align="center" valign="top" bgcolor="{{settings.color.surface}}" style="padding:65px 26px 43px;background-color:{{settings.color.surface}};text-align:center;vertical-align:top;">
      <table class="freshine-component freshine-measurement-card" role="presentation" width="548" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:548px;border-collapse:collapse;margin:0 auto;">
        <tr>
          <td align="center" style="padding:0;text-align:center;">
            <!-- FRESHINE_SLOT_START:measurement.image -->
            <img src="{{content.measurement.image.url}}" alt="{{content.measurement.image.alt}}" width="548" height="493" data-freshine-slot="measurement.image" style="display:block;width:100%;height:auto;border:0;outline:none;text-decoration:none;">
            <!-- FRESHINE_SLOT_END:measurement.image -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="50" style="height:50px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td align="left" style="padding:0 0 0 19px;text-align:left;">
              <!-- FRESHINE_SLOT_START:measurement.title -->
              <span data-freshine-slot="measurement.title" style="display:block;color:{{settings.color.text}};font-family:{{settings.font.body}};font-size:26px;font-weight:600;line-height:36px;letter-spacing:0;text-align:left;word-break:break-word;overflow-wrap:anywhere;">{{content.measurement.title}}</span>
              <!-- FRESHINE_SLOT_END:measurement.title -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="12" style="height:12px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
              <!-- FRESHINE_SLOT_START:measurement.subtitle -->
              <span data-freshine-slot="measurement.subtitle" style="display:block;color:{{settings.color.text}};font-family:{{settings.font.body}};font-size:20px;font-weight:400;line-height:28px;letter-spacing:0;text-align:left;word-break:break-word;overflow-wrap:anywhere;">{{content.measurement.subtitle}}</span>
              <!-- FRESHINE_SLOT_END:measurement.subtitle -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="9" style="height:9px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
              <!-- FRESHINE_SLOT_START:measurement.cta -->
              <a href="{{content.measurement.cta.url}}" data-freshine-href-slot="measurement.cta.url" target="_blank" data-freshine-slot="measurement.cta.label" style="display:inline-block;color:{{settings.color.action}};font-family:{{settings.font.body}};font-size:20px;font-weight:500;line-height:28px;letter-spacing:0;text-align:left;text-decoration:underline;text-underline-offset:4px;word-break:break-word;overflow-wrap:anywhere;">{{content.measurement.cta.label}}</a>
              <!-- FRESHINE_SLOT_END:measurement.cta -->
            </td></tr></table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
