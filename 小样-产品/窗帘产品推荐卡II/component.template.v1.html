<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.surface}}" style="width:100%;border-collapse:collapse;background-color:{{settings.color.surface}};">
  <tr>
    <td align="center" valign="top" bgcolor="{{settings.color.surface}}" style="padding:48px 26px 56px;background-color:{{settings.color.surface}};text-align:center;vertical-align:top;">
      <table class="freshine-component freshine-curtain-recommendation-overlay" role="presentation" width="548" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:548px;border-collapse:collapse;margin:0 auto;">
        <tr>
          <td align="center" style="padding:0;text-align:center;">
            <!-- FRESHINE_SLOT_START:intro.title -->
            <span data-freshine-slot="intro.title" style="display:block;color:{{settings.color.text}};font-family:{{settings.font.display}};font-size:30px;font-weight:500;line-height:38px;letter-spacing:0px;text-align:center;word-break:break-word;overflow-wrap:anywhere;">{{content.intro.title}}</span>
            <!-- FRESHINE_SLOT_END:intro.title -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="28" style="height:28px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
            <!-- FRESHINE_SLOT_START:intro.subtitle -->
            <span data-freshine-slot="intro.subtitle" style="display:block;color:{{settings.color.text}};font-family:{{settings.font.body}};font-size:18px;font-weight:500;line-height:27px;letter-spacing:0px;text-align:center;word-break:break-word;overflow-wrap:anywhere;">{{content.intro.subtitle}}</span>
            <!-- FRESHINE_SLOT_END:intro.subtitle -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="24" style="height:24px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
            <!-- FRESHINE_SLOT_START:product.images.scene -->
            <a href="{{content.product.url}}" data-freshine-href-slot="product.url" target="_blank" style="display:block;text-decoration:none;">
              <img src="{{content.product.images.scene.url}}" alt="{{content.product.images.scene.alt}}" width="548" height="495" data-freshine-slot="product.images.scene" style="display:block;width:100%;height:auto;border:0;outline:none;text-decoration:none;">
            </a>
            <!-- FRESHINE_SLOT_END:product.images.scene -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
              <tr>
                <td width="296" valign="top" style="width:54.0145985%;padding:79px 0 0 18px;vertical-align:top;text-align:left;">
                  <!-- FRESHINE_SLOT_START:product.name -->
                  <span data-freshine-slot="product.name" style="display:block;color:{{settings.color.text}};font-family:{{settings.font.display}};font-size:24px;font-weight:500;line-height:32px;text-align:left;word-break:break-word;overflow-wrap:anywhere;">{{content.product.name}}</span>
                  <!-- FRESHINE_SLOT_END:product.name -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="22" style="height:22px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
                  <!-- FRESHINE_SLOT_START:product.color.label -->
                  <span data-freshine-slot="product.color.label" style="display:block;color:{{settings.color.text}};font-family:{{settings.font.body}};font-size:22px;font-weight:700;line-height:28px;text-align:left;word-break:break-word;overflow-wrap:anywhere;">{{content.product.color.label}}</span>
                  <!-- FRESHINE_SLOT_END:product.color.label -->
                  <!-- FRESHINE_SLOT_START:product.color.value -->
                  <span data-freshine-slot="product.color.value" style="display:block;color:{{settings.color.text}};font-family:{{settings.font.body}};font-size:22px;font-weight:700;line-height:28px;text-align:left;word-break:break-word;overflow-wrap:anywhere;">{{content.product.color.value}}</span>
                  <!-- FRESHINE_SLOT_END:product.color.value -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;"><tr><td height="28" style="height:28px;font-size:0;line-height:0;">&nbsp;</td></tr></table>
                  <!-- FRESHINE_SLOT_START:product.cta.label -->
                  <table role="presentation" width="164" cellpadding="0" cellspacing="0" border="0" align="left" style="width:164px;border-collapse:separate;margin:0;">
                    <tr><td align="center" valign="middle" bgcolor="{{settings.color.action}}" style="padding:15px 20px;background-color:{{settings.color.action}};border-radius:30px;text-align:center;vertical-align:middle;">
                      <a href="{{content.product.url}}" data-freshine-href-slot="product.url" target="_blank" data-freshine-slot="product.cta.label" style="display:block;color:#FFFFFF;font-family:{{settings.font.body}};font-size:20px;font-weight:500;line-height:24px;letter-spacing:0.2px;text-align:center;text-decoration:none;white-space:nowrap;">{{content.product.cta.label}}</a>
                    </td></tr>
                  </table>
                  <!-- FRESHINE_SLOT_END:product.cta.label -->
                </td>
                <td width="252" valign="top" style="width:45.9854015%;padding:28px 0 0;vertical-align:top;text-align:right;">
                  <!-- FRESHINE_SLOT_START:product.images.detail -->
                  <table role="presentation" width="237" cellpadding="0" cellspacing="0" border="0" align="right" style="width:100%;max-width:237px;border-collapse:collapse;margin:0 10px 0 auto;background-color:#FFFFFF;">
                    <tr><td style="padding:9px;background-color:#FFFFFF;border:1px solid #D8D0C5;"><a href="{{content.product.url}}" data-freshine-href-slot="product.url" target="_blank" style="display:block;text-decoration:none;"><img src="{{content.product.images.detail.url}}" alt="{{content.product.images.detail.alt}}" width="217" height="245" data-freshine-slot="product.images.detail" style="display:block;width:100%;height:auto;border:0;outline:none;text-decoration:none;"></a></td></tr>
                  </table>
                  <!-- FRESHINE_SLOT_END:product.images.detail -->
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
