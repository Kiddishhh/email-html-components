<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixso HTML</title>
  <style>
@font-face {
	font-family: 'Montserrat';
	font-style: normal;
	font-weight: 800;
	src: url(fonts/Montserrat-ExtraBoldItalic_1.ttf) format('truetype');
}

@font-face {
	font-family: 'Montserrat';
	font-style: normal;
	font-weight: 600;
	src: url(fonts/Montserrat-SemiBold_1.ttf) format('truetype');
}
</style>
  <style>
:root, 
[data-collection-0-3-mode=""] {
  /* 参数 */
  --3xl: 30px;
  --base: 16px;
  --2xl: 24px;
}

:root, 
[data-collection-0-7-mode=""] {
  /* 参数 */
  --primary: rgba(141, 27, 27, 1);
}


* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

ol,ul,menu {
  padding-inline-start: 0;
  list-style: none;
}

ol li::marker, ul li::before {
  letter-spacing: 0;
}

.scroll-container > div {
  width: 100%;
}

.container > div {
  width: 100%;
}

.design-canvas > div {
  width: 100%;
}

html {
  width: 100%;
  height: 100%;
}

body { 
  width: 100%;
  height: 100%;
  margin: 0;
  background-color: white;
}
    
span {
  word-break: break-word;
}

.container {
  width: 100%;
  height: 100%;
}

.scroll-container {
  height: 100%;
  width: 100%;
  overflow: auto;
}

.design-canvas,.sale-module {
  width: 100%;
  position: relative;
  flex-shrink: 0;
}

.design-canvas {
  height: 100%;
}

.sale-module {
  height: 372px;
  min-width: 600px;
  overflow: hidden;
  background-color: rgba(255, 255, 255, 1);
}

.sale-content,.sale-background {
  width: 600px;
  height: 372px;
  position: absolute;
  left: 0px;
  top: 0px;
}

.sale-background,.cta-border-wrapper,.sparkle-left,.sparkle-right,.orbit-decoration {
  margin-left: auto;
  margin-right: auto;
}

.sale-background {
  right: 0px;
  bottom: 0px;
  margin-top: auto;
  margin-bottom: auto;
  background-color: rgba(248, 243, 230, 1);
}

.sale-title,.cta-label,.sitewide-label,.discount-value {
  text-align: center;
  text-decoration: none;
  color: var(--primary);
  height: auto;
  white-space: pre;
}

.sale-title {
  font-size: var(--3xl);
  font-family: "Georgia-Bold Italic";
  font-weight: 700;
  letter-spacing: 0px;
  font-feature-settings: "locl" 0;
  text-transform: capitalize;
  width: 481px;
  position: absolute;
  left: 60px;
  top: 51px;
}

.discount-cta {
  width: 287px;
  height: 47px;
  position: absolute;
  left: 158px;
  top: 282px;
}

.cta-surface {
  width: 100%;
  height: 100%;
  position: relative;
  border-radius: 42px 42px 42px 42px;
  z-index: 0;
}

.cta-border-wrapper {
  position: absolute;
  isolation: isolate;
  left: 0px;
  top: 0%;
  right: 0px;
  bottom: 0%;
  width: 287px;
  height: 100%;
}

.cta-border {
  position: absolute;
  inset: 0px;
  border-radius: 42px 42px 42px 42px;
  pointer-events: none;
  z-index: 1;
  border-width: 1px 1px 1px 1px;
  border-style: solid;
  box-sizing: border-box;
  border-color: var(--primary);
}

.cta-label,.sitewide-label,.discount-value {
  text-transform: uppercase;
  width: auto;
  flex-grow: 0;
}

.cta-label {
  font-size: var(--base);
  font-family: "Montserrat-SemiBold";
  font-weight: 600;
  letter-spacing: 0px;
  position: absolute;
  left: 50%;
  top: 29.79%;
  bottom: 29.79%;
  transform: translateX(calc(-50% + 0px));
}

.discount-artwork {
  width: 447px;
  height: 143px;
  position: absolute;
  left: 77px;
  top: 103px;
}

.sparkle-left,.sparkle-right,.orbit-decoration {
  background-size: 100% 100%;
  background-repeat: no-repeat;
}

.sparkle-left,.sparkle-right {
  width: 12.4853515625px;
  height: 24.927978515625px;
  position: absolute;
  top: 114px;
}

.sparkle-left {
  background-image: url("assets/images/Vector_294_3531.svg");
  left: -89.25732421875px;
  right: 89.25732421875px;
}

.sparkle-right {
  background-image: url("assets/images/Vector_294_3532.svg");
  left: 100.74267578125px;
  right: -100.74267578125px;
}

.sitewide-label,.discount-value {
  font-family: "Montserrat-ExtraBold Italic";
  font-weight: 800;
}

.sitewide-label {
  font-size: var(--2xl);
  letter-spacing: 2px;
  position: absolute;
  left: 50%;
  top: 79.72%;
  bottom: 0%;
  transform: translateX(calc(-50% + 5.5px));
}

.orbit-decoration {
  width: 448.5px;
  height: 69.735107421875px;
  background-image: url("assets/images/Vector_294_3534.svg");
  position: absolute;
  left: 0.75px;
  right: -0.75px;
  top: 59.715332px;
}

.discount-value {
  font-size: 80px;
  letter-spacing: 0px;
  position: absolute;
  left: 37.5px;
  top: 0px;
}


  </style>
</head>
<body>
<div class="scroll-container">
  <div class="design-canvas">
    <div class="sale-module">
      <div class="sale-content">
        <div class="sale-background"></div>
        <p class="sale-title">Columbus Day Sale</p>
        <div class="discount-cta">
          <div class="cta-border-wrapper">
            <div class="cta-surface"></div>
            <div class="cta-border"></div>
          </div>
          <p class="cta-label">CLAIM YOUR DISCOUNT</p>
        </div>
        <div class="discount-artwork">
          <div class="sparkle-left"></div>
          <div class="sparkle-right"></div>
          <p class="sitewide-label">sITEWIDE</p>
          <div class="orbit-decoration"></div>
          <p class="discount-value">65% OFF</p>
        </div>
      </div>
    </div>
  </div>
</div>


<script>

</script>

</body>
</html>
