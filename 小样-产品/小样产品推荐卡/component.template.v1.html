<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="{{settings.color.surface}}" style="width:100%;border-collapse:collapse;background-color:{{settings.color.surface}};">
  <tr>
    <td align="center" valign="top" bgcolor="{{settings.color.surface}}" style="padding:32px 26px 30px;background-color:{{settings.color.surface}};text-align:center;vertical-align:top;">
      <table class="freshine-component freshine-sample-product-recommendation" role="presentation" width="548" cellpadding="0" cellspacing="0" border="0" align="center" style="width:100%;max-width:548px;border-collapse:collapse;margin:0 auto;">
        <tr>
          <td width="319" valign="top" style="width:58.2116788%;padding:0;vertical-align:top;">
            <!-- FRESHINE_SLOT_START:product.images.scene -->
            <a href="{{content.product.url}}" data-freshine-href-slot="product.url" target="_blank" style="display:block;text-decoration:none;">
              <img src="{{content.product.images.scene.url}}" alt="{{content.product.images.scene.alt}}" width="319" height="319" data-freshine-slot="product.images.scene" style="display:block;width:100%;height:auto;border:0;border-radius:8px;outline:none;text-decoration:none;">
            </a>
            <!-- FRESHINE_SLOT_END:product.images.scene -->
          </td>
          <td width="32" style="width:5.8394161%;padding:0;font-size:0;line-height:0;">&nbsp;</td>
          <td width="197" valign="top" style="width:35.9489051%;padding:0;vertical-align:top;">
            <!-- FRESHINE_SLOT_START:product.images.fabric -->
            <a href="{{content.product.url}}" data-freshine-href-slot="product.url" target="_blank" style="display:block;text-decoration:none;">
              <img src="{{content.product.images.fabric.url}}" alt="{{content.product.images.fabric.alt}}" width="197" height="197" data-freshine-slot="product.images.fabric" style="display:block;width:100%;height:auto;border:0;border-radius:8px;outline:none;text-decoration:none;">
            </a>
            <!-- FRESHINE_SLOT_END:product.images.fabric -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
              <tr><td height="42" style="height:42px;font-size:0;line-height:0;">&nbsp;</td></tr>
            </table>
            <!-- FRESHINE_SLOT_START:product.title -->
            <span data-freshine-slot="product.title" style="display:block;color:{{settings.color.text}};font-family:{{settings.font.body}};font-size:24px;font-weight:700;line-height:28px;text-align:left;word-break:break-word;overflow-wrap:anywhere;">{{content.product.title}}</span>
            <!-- FRESHINE_SLOT_END:product.title -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
              <tr><td height="2" style="height:2px;font-size:0;line-height:0;">&nbsp;</td></tr>
            </table>
            <!-- FRESHINE_SLOT_START:product.subtitle -->
            <span data-freshine-slot="product.subtitle" style="display:block;color:{{settings.color.text}};font-family:{{settings.font.body}};font-size:20px;font-weight:400;line-height:26px;text-align:left;word-break:break-word;overflow-wrap:anywhere;">{{content.product.subtitle}}</span>
            <!-- FRESHINE_SLOT_END:product.subtitle -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;">
              <tr><td height="8" style="height:8px;font-size:0;line-height:0;">&nbsp;</td></tr>
            </table>
            <!-- FRESHINE_SLOT_START:product.cta.label -->
            <a href="{{content.product.url}}" data-freshine-href-slot="product.url" target="_blank" style="display:inline-block;color:{{settings.color.text}};font-family:{{settings.font.body}};font-size:20px;font-weight:400;line-height:24px;text-align:left;text-decoration:underline;text-underline-offset:3px;word-break:break-word;overflow-wrap:anywhere;">{{content.product.cta.label}}</a>
            <!-- FRESHINE_SLOT_END:product.cta.label -->
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
